[package]
name = "sunsetscan"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Scan a codebase for calls into APIs that have an announced shutdown date, and report every hit with file:line, days remaining and the official migration path. Offline Rust CLI."
authors = ["printemps.tokyo <develop@printemps.tokyo>"]
repository = "https://github.com/printemps-tokyo/sunsetscan"
homepage = "https://github.com/printemps-tokyo/sunsetscan"
readme = "README.md"
keywords = ["deprecation", "sunset", "migration", "openai", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "sunsetscan"
path = "src/main.rs"

[lib]
name = "sunsetscan"
path = "src/lib.rs"

[dependencies]
# Error context for the thin binary layer (org convention).
anyhow = "1"
# Argument parsing (derive API, org convention).
clap = { version = "4", features = ["derive"] }
# gitignore-aware directory walk, same crate repotome and agentsdoc use. Its
# `overrides` module also supplies the glob engine for --exclude, so no separate
# globset dependency is needed.
ignore = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
